<style>
/* Layout: one phone-width column, sticky bottom tab bar, Frosted Morning theme (single dark look by choice) */
:root{
  --bg:#0E1621; --card:#182433; --card2:#1E3045; --line:#2A3A4E;
  --text:#EAF2F8; --muted:#A7B8C8; --accent:#9FD0F0; --accent-ink:#0E1621; --coffee:#D29B6C;
  --warn:#F2C14E; --good:#9BD39B;
  --display:'Readex Pro', 'Segoe UI', system-ui, sans-serif;
  --body:'Readex Pro', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.flake{position:absolute;top:-10px;border-radius:50%;background:var(--text);animation:fall linear infinite}
@keyframes fall{to{transform:translate(-24px,110vh)}}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.greet{font-size:13px;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px}
.lang-btn{min-width:64px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:4px}
.seg button{height:42px;border-radius:20px;border:none;background:transparent;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
select,input[type=number],input[type=text],input[type=date],textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px 12px}
textarea{min-height:64px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stat.hi b{color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.warn{color:var(--warn);font-size:14px}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.steps li.now{border-color:var(--accent);background:var(--card2);font-weight:700}
.steps li.past{opacity:.55}
.steps li .tm{color:var(--muted)}
.steps li.now .tm{color:var(--accent)}
.btn{min-height:52px;border-radius:26px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer;padding:0 20px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.small{min-height:44px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:transparent;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.faces{display:flex;justify-content:space-between}
.face{width:52px;height:52px;border-radius:26px;border:2px solid transparent;background:transparent;font-size:26px;cursor:pointer}
.face[aria-pressed="true"]{border-color:var(--accent);background:var(--card2)}
.fix{border:1px solid var(--accent)}
.fix .big{font-family:var(--display);font-weight:700;font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.muted{color:var(--muted);font-size:14px}
.clock{font-family:var(--display);font-size:64px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.pour{display:flex;justify-content:center}
.stream{stroke-dasharray:6 6;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.drip{animation:drip 1.4s ease-in infinite}
.drip2{animation:drip 1.4s ease-in .7s infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}85%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.level{transform-box:fill-box;transform-origin:bottom;animation:fill 7s ease-in-out infinite alternate}
@keyframes fill{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.paused .stream,.paused .drip,.paused .drip2,.paused .level{animation-play-state:paused}
.list{display:flex;flex-direction:column;gap:10px}
.bean-title{font-weight:700;font-size:17px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.badge.ex{border-color:var(--warn);color:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{min-height:60px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs button .ic{font-size:20px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:700;z-index:10}
ul.plain{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion: reduce){.flake,.stream,.drip,.drip2,.level{animation:none}.flake{display:none}}
</style>

function t(k,v){let s=(S[st.lang]&&S[st.lang][k])||S.en[k]||k;if(v)for(const n in v)s=s.split('{'+n+'}').join(v[n]);return s;}
function digits(s){s=String(s);return st.digits==='arabic'?s.replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):s;}
function n(x){return digits(Number.isInteger(x)?x:Math.round(x*10)/10);}
function mmss(sec){sec=Math.max(0,Math.round(sec));return digits(Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function temp(c){return st.tempUnit==='F'?digits(Math.round(c*9/5+32))+' °F':digits(c)+' °C';}
function bean(id){
  const own=st.beans.find(b=>b.id===id);if(own)return own;
  const c=catItem(id);if(!c)return null;
  return {id:c.cid,cid:c.cid,brand:roasteryOf(id).brand,decaf:!!c.decaf,name:c.name,origin:c.origin,region:c.region,process:c.process,pnote:c.pnote,roast:roastGuess(c),roastEst:true,roastDate:(st.roastDates||{})[c.cid]||'',notes:c.notes,alt:c.alt,uses:c.uses,price:c.price,blend:c.blend};
}

function thumb(b,size){
  const s=size||48,k=pkind(b),many=b.blend&&b.blend.length;

/* ---------- brewing math ---------- */
function calc(){
  const r=st.recipe,R=Number(r.ratio)||16;
  let C=Number(r.coffee)||0;
  const W=Math.round(C*R),s=r.mode==='iced'?(Number(r.iceShare)||40)/100:0;
  const H=Math.round(W*(1-s)),I=W-H,B=Math.round(3*C),Y=Math.round(W-2*C);
  const b=bean(r.beanId);let T=BASE_TEMP[b?b.roast:'ml'];
  if(r.mode==='iced')T+=2; if(st.preset==='bright')T+=1; if(st.preset==='rich')T-=1;
  T=Math.min(96,Math.max(84,T+(r.tempAdj||0)));
  const warn=r.method==='switch'?(H>360?t('warnSw'):''):(r.dripper==='01'&&C>20?t('warn01'):(C>30?t('warn02'):''));
  let steps;
  if(r.method==='v60'){
    steps=[{at:0,k:'st_bloom',g:B},{at:45,k:'st_pour',g:Math.round(H*.6)},{at:75,k:'st_pour',g:H},{at:105,k:'st_swirl'},{at:180,k:'st_done'}];
  }else{
    const open=120+(r.steepAdj||0);
    steps=[{at:0,k:'st_sbloom',g:B},{at:30,k:'st_spour',g:H},{at:open,k:'st_open'},{at:open+60,k:'st_done'}];
  }
  return {C,W,H,I,B,Y,T,warn,steps};
}
function target(){const r=st.recipe;if(r.method==='switch')return [150+(r.steepAdj||0),240+(r.steepAdj||0)];return r.mode==='iced'?[150,180]:[165,210];}

/* ---------- adjustment engine ---------- */
function suggest(ts){
  const r=st.recipe,b=bean(r.beanId),roast=b?b.roast:'m',tags=ts.tags,has=x=>tags.includes(x);
  const [lo,hi]=target(),fast=ts.time<lo,slow=ts.time>hi,sw=r.method==='switch';
  const reasons=[];const tinfo={t:mmss(ts.time),lo:mmss(lo),hi:mmss(hi)};
  const prev=lastBrew(r.beanId);
  if(ts.vs==='worse'&&prev&&prev.fix&&prev.fix.primary!=='keep'&&prev.fix.primary!=='revert'){
    reasons.push(t('r_worse'));return {primary:'revert',second:prev.fix.second,undo:prev.fix.primary,reasons};
  }
  if(has('right')||(tags.length===0&&ts.rating>=4)){
    reasons.push(t('r_good'));
    const good=st.brews.filter(x=>x.beanId===r.beanId&&x.rating>=4).length+(ts.rating>=4?1:0);
    if(good>=2)reasons.push(t('r_mine'));
    return {primary:'keep',second:null,reasons};
  }
  let p,s2;
  if(has('sour')&&has('bitter')){p='evenBloom';s2='gentler';reasons.push(t('r_both'));}
  else if(has('sour')){
    reasons.push(t('r_sour'));
    if(fast){reasons.push(t('r_fast',tinfo));p='grindFiner';s2='hotter';}
    else if(sw){p='steepLonger';s2='grindFiner';}
    else if(r.mode==='iced'){reasons.push(t('r_iced'));p='grindFiner';s2='hotter';}
    else if(roast==='l'||roast==='ml'){reasons.push(t('r_light'));p='hotter';s2='grindFiner';}
    else{p='grindFiner';s2='bloomLonger';}
  }
  else if(has('bitter')){
    reasons.push(t('r_bitter'));
    if(slow){reasons.push(t('r_slow',tinfo));p='grindCoarser';s2='cooler';}
    else if(sw){p='steepShorter';s2='grindCoarser';}
    else if(roast==='md'||roast==='d'){reasons.push(t('r_dark'));p='cooler';s2='grindCoarser';}
    else{p='grindCoarser';s2='cooler';}
  }
  else if(has('dry')){reasons.push(t('r_dry'));if(slow){reasons.push(t('r_slow',tinfo));p='grindCoarser';s2='gentler';}else{p='gentler';s2='grindCoarser';}}
  else if(has('muddy')){reasons.push(t('r_muddy'));p='grindCoarser';s2='gentler';}
  else if(has('flat')){reasons.push(t('r_flat'));if(fast){reasons.push(t('r_fast',tinfo));p='grindFiner';s2='hotter';}else{p='hotter';s2='checkBeans';}}
  else if(has('weak')){reasons.push(t('r_weak'));if(fast){reasons.push(t('r_fast',tinfo));p='grindFiner';s2='tighter';}else{p='tighter';s2='bloomLonger';}}
  else if(has('strong')){reasons.push(t('r_strong'));if(slow){reasons.push(t('r_slow',tinfo));p='grindCoarser';s2='wider';}else{p='wider';s2='gentler';}}
  else if(fast){reasons.push(t('r_fast',tinfo));p='grindFiner';s2='hotter';}
  else if(slow){reasons.push(t('r_slow',tinfo));p='grindCoarser';s2='cooler';}
  else{p='keep';s2=null;reasons.push(t('r_good'));}
  if(p!=='keep')reasons.push(t('r_one'));
  return {primary:p,second:s2,reasons};
}
function grinderAfter(k){const g=G();if(k==='grindFiner')return g.clicks-g.step;if(k==='grindCoarser')return g.clicks+g.step;return null;}
function applyFix(k,undo){
  const r=st.recipe,g=G();
  const act=(key,sign)=>{
    if(key==='grindFiner')g.clicks=Math.max(1,g.clicks-sign*g.step);
    if(key==='grindCoarser')g.clicks+=sign*g.step;
    if(key==='hotter')r.tempAdj=(r.tempAdj||0)+2*sign;
    if(key==='cooler')r.tempAdj=(r.tempAdj||0)-2*sign;
    if(key==='tighter')r.ratio=Math.max(12,r.ratio-sign);
    if(key==='wider')r.ratio=Math.min(18,r.ratio+sign);
    if(key==='steepLonger')r.steepAdj=(r.steepAdj||0)+30*sign;
    if(key==='steepShorter')r.steepAdj=(r.steepAdj||0)-30*sign;
  };
  if(k==='revert'&&undo)act(undo,-1);else act(k,1);
  persist();
}

      (beanForm.err?'<div class="warn" role="alert">'+t('required')+'</div>':'')+
      '<div class="grid2"><button type="button" class="btn ghost small" data-act="closeBean">'+t('cancel')+'</button><button type="submit" class="btn small">'+t('saveBean')+'</button></div></form>';
  }
  h+='<div class="list">'+st.beans.map(b=>{
    const ds=daysSince(b.roastDate),hint=ds<4?t('tooFresh'):(ds>42?t('stale'):t('peak'));
    return '<article class="card"><div class="row between"><div class="bean-title">'+esc(b.name)+'</div>'+(b.example?'<span class="badge ex">'+t('example')+'</span>':'')+'</div>'+
      '<div class="muted">'+esc(b.brand)+' · '+t('c_'+b.origin)+(b.region?' · '+esc(b.region):'')+(b.variety?' · '+esc(b.variety):'')+'</div>'+
      '<div class="row"><span class="badge">'+(b.pnote?esc(b.pnote):t('p_'+b.process))+'</span><span class="badge">'+t('r_'+b.roast)+'</span>'+(b.alt?'<span class="badge">'+t('altM',{a:digits(b.alt)})+'</span>':'')+(b.decaf?'<span class="badge">'+t('decaf')+'</span>':'')+'</div>'+
      (b.notes?'<div>'+esc(b.notes)+'</div>':'')+
      '<div class="muted">'+t('daysSince',{n:digits(ds)})+' · '+hint+'</div>'+
      '<button type="button" class="btn ghost small" data-use="'+b.id+'">'+t('useBean')+' ☕</button></article>';
  }).join('')+'</div>';
  return h;
}
function viewLibrary(){
  const r=ROASTERIES.find(x=>x.id===st.libR)||ROASTERIES[0];
  let h=seg('libR',ROASTERIES.map(x=>[x.id,x.short[st.lang]]),r.id);
  h+='<section class="card"><div class="row between"><div class="row" style="flex-wrap:nowrap">'+logo(r,44)+'<div><div class="bean-title">'+rn(r)+'</div><div class="muted">'+r.place[st.lang]+' · '+t('beansCount',{n:digits(live(r).length)})+'</div></div></div><a href="'+r.url+'" target="_blank" rel="noopener" style="color:var(--accent)">'+r.site+' ↗</a></div>'+
    '<div class="muted">'+t('fromSite',{s:r.site,d:digits(r.checked)})+'</div>'+legend()+'</section>';
  h+='<div class="list">'+live(r).map(c=>{
    return '<article class="card"'+(c.soldOut?' style="opacity:.75"':'')+'><div class="row" style="flex-wrap:nowrap">'+thumb(c,48)+'<div style="flex:1;min-width:0"><div class="bean-title">'+esc(c.name)+'</div><span class="badge">'+t('priceFrom',{p:digits(c.price)})+(c.size?' · '+digits(c.size)+' g':'')+'</span>'+(c.soldOut?' <span class="badge">'+t('soldOut')+'</span>':'')+'</div></div>'+
      '<div class="muted">'+t('c_'+c.origin)+(c.region?' · '+esc(c.region):'')+'</div>'+
      '<div class="row"><span class="badge">'+(c.pnote?esc(c.pnote):t('p_'+c.process))+'</span>'+(c.decaf&&c.pnote!=='Decaf'?'<span class="badge">'+t('decaf')+'</span>':'')+(c.alt?'<span class="badge">'+t('altM',{a:digits(c.alt)})+'</span>':'')+'</div>'+
      (c.notes?'<div>'+esc(c.notes)+'</div>':'<div class="muted">'+t('noDetails')+'</div>')+
      (c.uses.length?'<div class="muted">'+t('bestFor')+': '+c.uses.map(u=>t('u_'+u)).join(' · ')+'</div>':'')+
      '<button type="button" class="btn ghost small" data-use="'+c.cid+'">'+t('useBean')+' ☕</button></article>';
  }).join('')+'</div>';
  return h;
}
function viewLog(){
  let h='<h1>'+t('tabLog')+' 📓</h1>';
  const list=st.brews.slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!list.length)return h+'<div class="card muted">'+t('emptyLog')+'</div>';
  h+='<div class="list">'+list.map(w=>{
    const b=bean(w.beanId);
    return '<article class="card"><div class="row between"><div class="bean-title">'+FACES[(w.rating||3)-1]+' '+beanLabel(b)+'</div>'+(w.example?'<span class="badge ex">'+t('example')+'</span>':'')+'</div>'+
      '<div class="muted">'+digits(w.date)+' · '+t(w.method)+' · '+(w.mode==='iced'?'🧊 '+t('iced'):'🔥 '+t('hot'))+' · '+n(w.coffee)+' g / '+n(w.water)+' g'+(w.ice?' + '+n(w.ice)+' g 🧊':'')+' · '+temp(w.temp)+' · '+t('drawdownShort',{t:mmss(w.time)})+'</div>'+
      (w.tags.length?'<div class="chips">'+w.tags.map(k=>'<span class="badge">'+t('tag_'+k)+'</span>').join('')+'</div>':'')+
      (w.note?'<div>'+esc(w.note)+'</div>':'')+
      (w.fix?'<div><span class="eyebrow">'+t('nextTime')+'</span> '+t('f_'+w.fix.primary)+'</div>':'')+
      '<div><button type="button" class="chip" data-del="'+w.id+'">'+t('del')+'</button></div></article>';
  }).join('')+'</div>';
  return h;
}
function viewMe(){
  return '<h1>'+t('tabMe')+'</h1>'+
  '<section class="card"><div class="label">'+t('language')+'</div>'+seg('lang',[['en','English'],['ar','العربية']],st.lang)+
  '<div class="label">'+t('digits')+'</div>'+seg('digits',[['western',t('western')],['arabic',t('arabicDigits')]],st.digits)+
  '<div class="label">'+t('tempUnit')+'</div>'+seg('tempUnit',[['C','°C'],['F','°F']],st.tempUnit)+
  '<div class="label">'+t('preset')+'</div>'+seg('preset',[['bright',t('bright')],['balanced',t('balanced')],['rich',t('rich')]],st.preset)+
  '</section>'+
  (function(){const g=G();return '<section class="card"><div class="field"><label class="label" for="gSel">⚙️ '+t('activeGrinder')+'</label><select id="gSel" data-grinder="1">'+
  st.grinders.map(x=>'<option value="'+x.id+'"'+(x.id===g.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>'+
  '<div class="field"><label class="label" for="gc_'+g.id+'">'+t('grinderSetting')+'</label><input id="gc_'+g.id+'" type="number" min="1" max="120" value="'+g.clicks+'" data-me="gclicks:'+g.id+'"></div></section>';})()+
  '<section class="card"><div class="label">'+t('notBuilt')+'</div><ul class="plain"><li>'+t('nb1')+'</li><li>'+t('nb2')+'</li><li>'+t('nb3')+'</li><li>'+t('nb4')+'</li><li>'+t('nb5')+'</li></ul></section>'+
  '<div class="muted">'+t('deviceNote')+'</div><button type="button" class="btn ghost small" data-act="reset">'+t('resetData')+'</button>';
}

function render(){
  document.documentElement.lang=st.lang;document.documentElement.dir=st.lang==='ar'?'rtl':'ltr';
  const hr=new Date().getHours();
  const head='<header class="top"><div><div class="greet">'+(hr<16?t('morning'):t('evening'))+' ☕❄️</div><div style="font-family:var(--display);font-weight:700;font-size:24px">'+t('appName')+'</div></div>'+
    '<button type="button" class="lang-btn" data-act="lang" aria-label="Language / اللغة">'+(st.lang==='en'?'EN | ع':'ع | EN')+'</button></header>';
  const body={brew:viewBrew,beans:viewBeans,log:viewLog,me:viewMe}[st.tab]();
  document.getElementById('app').innerHTML=head+body;
  const tabs=[['brew','☕',t('tabBrew')],['beans','🫘',t('tabBeans')],['log','📓',t('tabLog')],['me','⚙️',t('tabMe')]];
  document.getElementById('tabs').innerHTML='<div class="in">'+tabs.map(x=>'<button type="button" data-tab="'+x[0]+'"'+(st.tab===x[0]?' aria-current="page"':'')+'><span class="ic" aria-hidden="true">'+x[1]+'</span>'+x[2]+'</button>').join('')+'</div>';
  if(timer.on)tick();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-tab]');if(!el)return;
  const d=el.dataset;
  if(d.tab){st.tab=d.tab;persist();render();window.scrollTo(0,0);return;}
  if(d.set){
    const k=d.set,v=d.val;
    if(k==='vs'){tasting.vs=v;tasting.fix=null;}
    else if(['lang','digits','tempUnit','preset','beansView','grinderId','libR'].includes(k))st[k]=v;
    else st.recipe[k]=v;
    persist();render();return;
  }
  if(d.rate){tasting.rating=Number(d.rate);tasting.fix=null;render();return;}
  if(d.tag){const i=tasting.tags.indexOf(d.tag);if(i>=0)tasting.tags.splice(i,1);else{if(d.tag==='right')tasting.tags=[];else tasting.tags=tasting.tags.filter(x=>x!=='right');tasting.tags.push(d.tag);}tasting.fix=null;render();return;}
  if(d.time){tasting.time=Math.max(30,tasting.time+Number(d.time));tasting.fix=null;render();return;}
  if(d.lib){const c=catItem(d.lib);if(c){beanForm={err:false,draft:{cid:c.cid,brand:roasteryOf(c.cid).brand,name:c.name,origin:c.origin,region:c.region,variety:'',process:c.process,pnote:c.pnote||'',roast:roastGuess(c),roastEst:true,roastDate:'',notes:c.notes,decaf:!!c.decaf,alt:c.alt,price:c.price,uses:c.uses}};st.beansView='mine';persist();render();window.scrollTo(0,0);}return;}
  if(d.roastery){picker=d.roastery;render();return;}
  if(d.pickb){st.recipe.beanId=d.pickb;picker=null;persist();render();window.scrollTo(0,0);return;}
  if(d.use){picker=null;st.recipe.beanId=d.use;st.tab='brew';persist();render();window.scrollTo(0,0);return;}
  if(d.del){st.brews=st.brews.filter(w=>w.id!==d.del);persist();render();return;}
  switch(d.act){
    case 'lang':st.lang=st.lang==='en'?'ar':'en';persist();render();break;
    case 'pick':picker='roasteries';render();break;
        case 'pickOwn':picker='own';render();break;
    case 'pickBack':picker='roasteries';render();break;
    case 'pickClose':picker=null;render();break;
    case 'useSuggest':G().clicks=suggestClicks();persist();render();break;
    case 'start':timer={on:true,paused:false,start:Date.now(),acc:0,iv:setInterval(tick,250)};
      try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{timer.lock=l;}).catch(()=>{});}catch(err){}
      render();window.scrollTo(0,0);break;
    case 'pause':if(timer.paused){timer.start=Date.now();timer.paused=false;}else{timer.acc=elapsed();timer.paused=true;}render();break;
    case 'cancel':stopTimer();render();break;
    case 'finish':{const e2=Math.round(elapsed());stopTimer();tasting={rating:0,tags:[],time:e2,vs:null,note:'',fix:null,applied:false};render();window.scrollTo(0,0);break;}
    case 'fix':grabNote();if(!tasting.rating&&!tasting.tags.length){toast(t('pickTaste'));break;}tasting.fix=suggest(tasting);render();break;
    case 'apply':grabNote();applyFix(tasting.fix.primary,tasting.fix.undo);tasting.applied=true;toast(t('applied'));render();break;
    case 'saveTaste':{
      grabNote();if(!tasting.rating&&!tasting.tags.length){toast(t('pickTaste'));break;}
      if(!tasting.fix)tasting.fix=suggest(tasting);
      const r=st.recipe,c=calc();
      st.brews.push({id:'w'+Date.now(),date:today(0),beanId:r.beanId,method:r.method,mode:r.mode,coffee:c.C,water:c.H,ice:c.I,ratio:r.ratio,temp:c.T,clicks:G().clicks,grinder:G().name,time:tasting.time,rating:tasting.rating||3,tags:tasting.tags.slice(),vs:tasting.vs,note:tasting.note,fix:{primary:tasting.fix.primary,second:tasting.fix.second}});
      tasting=null;st.tab='log';persist();toast(t('saved'));render();window.scrollTo(0,0);break;}
    case 'newBean':beanForm={err:false,draft:{brand:'',name:'',origin:'ET',region:'',variety:'',process:'washed',roast:'l',roastDate:today(7),notes:'',decaf:false}};render();break;
    case 'closeBean':beanForm=null;render();break;
    case 'reset':stopTimer();tasting=null;beanForm=null;const lang=st.lang;st=examples();st.lang=lang;persist();toast(t('resetDone'));render();break;
  }
});
function grabNote(){const el=document.getElementById('noteIn');if(el&&tasting)tasting.note=el.value;}
function stopTimer(){clearInterval(timer.iv);try{timer.lock&&timer.lock.release();}catch(e){}timer={on:false,paused:false,start:0,acc:0,iv:null};}
document.addEventListener('submit',e=>{
  if(e.target.id!=='beanForm')return;e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const x=(beanForm&&beanForm.draft)||{};
  const d={cid:x.cid,pnote:x.pnote,roastEst:x.roastEst,alt:x.alt,price:x.price,uses:x.uses,brand:v('bf_brand'),name:v('bf_name'),origin:v('bf_origin'),region:v('bf_region'),variety:v('bf_variety'),process:v('bf_process'),roast:v('bf_roast'),roastDate:v('bf_date'),notes:v('bf_notes'),decaf:document.getElementById('bf_decaf').checked};
  if(!d.brand||!d.name||!d.roastDate){beanForm={err:true,draft:d};render();return;}
  d.id='b'+Date.now();st.beans.unshift(d);beanForm=null;persist();toast(t('beanSaved'));render();
});
document.addEventListener('input',e=>{
  if(e.target.dataset.grinder){st.grinderId=e.target.value;persist();render();return;}
  const el=e.target,k=el.dataset.rec;
  if(k){
    if(k==='beanId'||k==='dripper'){st.recipe[k]=el.value;persist();render();return;}
    const val=Number(el.value);if(!isFinite(val))return;st.recipe[k]=val;persist();
    if(k==='ratio'){const rv=document.getElementById('ratioVal');if(rv)rv.textContent=digits('1:'+val);}
    if(k==='iceShare'){const iv=document.getElementById('iceVal');if(iv)iv.textContent=digits(val)+'%';}
    const out=document.getElementById('calcOut');if(out)out.innerHTML=calcOut(calc());
    return;
  }
  const m=el.dataset.me;
  if(m){
    const val=Number(el.value);if(!isFinite(val)||val<=0)return;
    if(m==='cupSize')st.cupSize=val;
    else{const [f,id]=m.split(':'),g=st.grinders.find(x=>x.id===id);if(g){if(f==='gclicks')g.clicks=val;if(f==='gstep')g.step=val;}}
    persist();
  }
  if(el.dataset.roast){st.roastDates=st.roastDates||{};st.roastDates[el.dataset.roast]=el.value;persist();}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.rec==='beanId')return;});

/* ---------- snow ---------- */
(function(){const box=document.getElementById('snow');let h='';for(let i=0;i<18;i++){const s=2+Math.random()*3;h+='<div class="flake" style="left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;opacity:'+(.15+Math.random()*.3)+';animation-duration:'+(9+Math.random()*8)+'s;animation-delay:-'+(Math.random()*15)+'s"></div>';}box.innerHTML=h;})();

render();
})();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
